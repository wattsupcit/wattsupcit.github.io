button{font:inherit;color:inherit;border:0;background:none;padding:0;cursor:pointer;transition:transform var(--d1) var(--e),background var(--d2)}
button:active{transform:scale(.98)}
input,textarea,select{display:block;width:100%;font:inherit;color:inherit;border:0;outline:0;background:none}
textarea{resize:none}
.i{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
@keyframes up{from{opacity:0;transform:translateY(8px)}}
@keyframes fi{from{opacity:0}}
@keyframes pop{from{opacity:0;transform:scale(.4)}}
@keyframes spn{to{transform:rotate(360deg)}}
@keyframes shk{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
@keyframes shm{to{transform:translateX(100%)}}
@keyframes flt{to{transform:translateY(-260px) scale(1.3);opacity:0}}
@keyframes ty{40%{transform:translateY(-4px)}}
@keyframes fl{to{transform:scaleX(1)}}
.mut{color:var(--mut);font-size:13px}.b{font-weight:700;color:var(--tx)}.err{min-height:20px;color:#ff6b6b;font-size:14px}.fx{flex:1;min-width:0}.w{width:100%}
.empty{margin:0;padding:24px 12px;text-align:center;color:var(--mut)}
.btn{padding:10px 16px;border-radius:8px;background:var(--acc);color:#fff;font-weight:700}.btn.g{background:var(--ln);color:var(--tx)}.btn:disabled{opacity:.4;pointer-events:none}
.brand{display:flex;align-items:center;gap:6px;margin:0;color:var(--acc);font-size:26px;font-weight:800;letter-spacing:-1px}.brand .i{width:1.1em;height:1.1em;stroke:none}.brand .lg{width:30px;height:30px;flex:none;border-radius:50%;object-fit:cover;box-shadow:0 0 0 2px #1f2f52,0 0 22px rgba(47,123,255,.4)}
.st>*{animation:up var(--d3) var(--e) both;animation-delay:calc(var(--i,0)*30ms)}
.tf{animation:up var(--d3) var(--e)}
